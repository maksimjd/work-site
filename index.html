<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор комментариев</title>
<style>
  /* ============ БАЗОВЫЕ СТИЛИ ============ */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0c11;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent1: #6366f1;
    --accent2: #a855f7;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ============ РАСКЛАДКА ============ */
  .layout {
    display: flex;
    min-height: 100vh;
    max-width: 1400px;
    margin: 0 auto;
  }

  .main {
    flex: 1;
    padding: 24px;
    min-width: 0;
  }

  .sidebar {
    width: 240px;
    flex-shrink: 0;
    padding: 24px 18px;
    border-left: 1px solid var(--border);
    background: #0d1016;
  }

  /* ============ САЙДБАР ============ */
  .sidebar h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .nav-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .nav-btn:hover { border-color: var(--accent1); }
  .nav-btn.active {
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    border-color: transparent;
    color: #fff;
    font-weight: 600;
  }

  .online-box {
    margin-top: 22px;
    padding: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .online-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    margin-right: 6px;
    animation: blink 2s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  .tg-box {
    margin-top: 18px;
    padding: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 12px;
  }
  .tg-box a {
    color: var(--accent2);
    text-decoration: none;
    font-weight: 600;
  }
  .tg-sparkle {
    animation: sparkle 1.6s infinite;
    display: inline-block;
  }
  @keyframes sparkle {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }

  /* ============ ЗАГОЛОВКИ / ПАНЕЛИ ============ */
  h1 {
    font-size: 20px;
    margin-bottom: 18px;
    font-weight: 700;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  /* ============ ВКЛАДКИ РАЗНОЙ ФОРМЫ ============ */
  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    align-items: center;
  }

  .tab-text {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  .tab-text.active {
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    border-color: transparent;
    color: #fff;
    font-weight: 600;
  }

  .tab-image {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px 9px 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    position: relative;
    padding-left: 14px;
  }
  .tab-image::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    border-radius: 8px 0 0 8px;
    background: var(--border);
  }
  .tab-image.active::before {
    background: linear-gradient(180deg, var(--accent1), var(--accent2));
  }
  .tab-image.active {
    border-color: var(--accent1);
    font-weight: 600;
  }

  /* ============ ИНПУТЫ ============ */
  input[type="text"],
  input[type="password"],
  textarea,
  select {
    width: 100%;
    background: #0f1218;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 9px 11px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--accent1);
  }
  textarea { resize: vertical; min-height: 70px; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 140px; }

  /* ============ КОМПАКТНЫЕ ЧИСЛОВЫЕ ПОЛЯ ============ */
  .num-field {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #0f1218;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 8px;
    width: 140px;
  }
  .num-field label {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }
  .num-field input {
    width: 46px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    text-align: center;
    padding: 4px 0;
  }

  /* ============ ГАЛОЧКИ ============ */
  .checks {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    margin: 12px 0;
  }
  .check {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .check input { accent-color: var(--accent1); }

  /* ============ КНОПКИ (со свечением) ============ */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.1s;
  }
  .btn:hover {
    border-color: var(--accent1);
    box-shadow: 0 0 10px rgba(99, 102, 241, 0.35);
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    border-color: transparent;
    color: #fff;
    font-weight: 600;
    box-shadow: 0 0 14px rgba(99, 102, 241, 0.45), 0 0 28px rgba(168, 85, 247, 0.25);
  }
  .btn-primary:hover {
    box-shadow: 0 0 20px rgba(99, 102, 241, 0.7), 0 0 40px rgba(168, 85, 247, 0.45);
    transform: translateY(-1px);
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled {
    box-shadow: none;
    transform: none;
  }

  .buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

  /* ============ СТАТУС ============ */
  .status {
    margin-top: 12px;
    font-size: 12px;
    min-height: 18px;
    color: var(--muted);
  }
  .status.error { color: #f87171; }
  .status.success { color: #34d399; }
  .status.loading { color: #fbbf24; }

  /* ============ ЗАГРУЗКА КАРТИНОК ============ */
  .drop-zone {
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 18px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .drop-zone.drag { border-color: var(--accent1); color: var(--accent1); }

  .thumbs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .thumb {
    position: relative;
    width: 64px;
    height: 64px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .thumb button {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-size: 11px;
    cursor: pointer;
    line-height: 1;
  }

  /* ============ СПИСОК КОММЕНТАРИЕВ ============ */
  .comments { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }

  .comment {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .comment-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .comment-num {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
  }
  .comment-text {
    font-size: 13px;
    line-height: 1.55;
    word-break: break-word;
  }
  .comment-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .comment-actions button {
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: #0f1218;
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .comment-actions button:hover {
    border-color: var(--accent1);
    color: var(--text);
    box-shadow: 0 0 8px rgba(99, 102, 241, 0.3);
  }

  /* ============ ЛОГ РАБОТЫ (внизу) ============ */
  .log-box {
    margin-top: 18px;
    background: linear-gradient(180deg, #0d1016 0%, #0b0e14 100%);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .log-box h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .log-box h3::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent2);
    box-shadow: 0 0 8px var(--accent2);
  }
  .log-list {
    max-height: 220px;
    overflow-y: auto;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 12px;
    line-height: 1.8;
    color: #cbd5e1;
  }
  .log-item {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    padding: 2px 0 2px 8px;
    border-left: 2px solid transparent;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .log-item .log-time {
    color: #64748b;
    flex-shrink: 0;
    user-select: none;
  }
  .log-item.info {
    border-left-color: #38bdf8;
    color: #bae6fd;
  }
  .log-item.ok {
    border-left-color: #34d399;
    color: #a7f3d0;
  }
  .log-item.err {
    border-left-color: #fb7185;
    color: #fecdd3;
  }
  /* Обычные строки */
  .log-item:not(.info):not(.ok):not(.err) {
    border-left-color: #475569;
    color: #cbd5e1;
  }

  /* ============ ИНСТРУКЦИИ ============ */
  .instr-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 8px;
  }

  .instr-card {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.1s;
  }
  .instr-card:hover {
    border-color: var(--accent1);
    box-shadow: 0 0 14px rgba(99, 102, 241, 0.35);
    transform: translateY(-1px);
  }
  .instr-card .instr-title {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 4px;
  }
  .instr-card .instr-desc {
    font-size: 12px;
    color: var(--muted);
  }

  .instr-article {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    line-height: 1.7;
  }
  .instr-article h2 {
    font-size: 18px;
    margin-bottom: 14px;
    font-weight: 700;
  }
  .instr-article h3 {
    font-size: 14px;
    margin: 18px 0 8px;
    font-weight: 700;
    color: var(--text);
  }
  .instr-article p {
    margin-bottom: 10px;
    font-size: 13px;
    color: var(--text);
  }
  .instr-article ul {
    margin: 8px 0 12px 20px;
    font-size: 13px;
  }
  .instr-article li {
    margin-bottom: 4px;
  }
  .instr-article code {
    background: #0f1218;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 12px;
    color: var(--accent2);
  }
  /* Ссылки в инструкциях — кликабельные, открываются в новом окне */
  .instr-article a {
    color: #a5b4fc;
    text-decoration: none;
    border-bottom: 1px dashed rgba(165, 180, 252, 0.5);
    transition: color 0.15s, border-color 0.15s;
  }
  .instr-article a:hover {
    color: #c4b5fd;
    border-bottom-color: #c4b5fd;
  }
  .instr-article .note {
    background: #0f1218;
    border-left: 3px solid var(--accent1);
    border-radius: 6px;
    padding: 10px 14px;
    margin: 12px 0;
    font-size: 12px;
    color: var(--muted);
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    margin-bottom: 14px;
    text-decoration: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .back-btn:hover {
    border-color: var(--accent1);
    box-shadow: 0 0 10px rgba(99, 102, 241, 0.35);
  }

  /* ============ ГЕНЕРАТОР ПАРОЛЕЙ ============ */
  .pwd-output {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
  }
  .pwd-output input {
    font-family: "SF Mono", Consolas, monospace;
    font-size: 15px;
    letter-spacing: 0.5px;
  }

  .strength {
    display: flex;
    gap: 4px;
    margin: 10px 0 4px;
  }
  .strength span {
    flex: 1;
    height: 5px;
    border-radius: 3px;
    background: var(--border);
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent1);
  }

  .slider-value {
    display: inline-block;
    min-width: 30px;
    text-align: center;
    font-weight: 600;
    color: var(--accent2);
  }

  /* Утилита для скрытия */
  .hidden { display: none !important; }

  /* Адаптив */
  @media (max-width: 760px) {
    .layout { flex-direction: column-reverse; }
    .sidebar {
      width: 100%;
      border-left: none;
      border-bottom: 1px solid var(--border);
    }
  }
</style>
</head>
<body>

<div class="layout">
  <!-- ==================== ОСНОВНОЙ КОНТЕНТ ==================== -->
  <main class="main">

    <!-- ===== РАЗДЕЛ: ГЕНЕРАТОР КОММЕНТАРИЕВ ===== -->
    <section id="section-comments">
      <h1>Генератор комментариев</h1>

      <div class="tabs">
        <button class="tab-text active" id="tabText">💬 Текст</button>
        <button class="tab-image" id="tabImage">🖼 Изображение</button>
      </div>

      <div class="panel">
        <label class="label">Режим авторизации</label>
        <div class="row" style="margin-bottom:10px;">
          <button class="btn" id="authNoKey">Без ключа</button>
          <button class="btn" id="authKey">С ключом</button>
        </div>
        <div id="keyBox" class="hidden">
          <label class="label">API-ключ Pollinations (enter.pollinations.ai)</label>
          <input type="password" id="apiKey" placeholder="Вставьте ключ...">
          <div class="status success" id="keySaved" style="display:none;">✓ Сохранён</div>
        </div>
      </div>

      <div class="panel">
        <label class="label">Текст поста или тема</label>
        <textarea id="postText" placeholder="Вставьте текст поста или опишите тему..."></textarea>

        <div style="margin-top:12px;">
          <label class="label">Свой стиль комментария (необязательно)</label>
          <input type="text" id="styleText" placeholder="Например: с юмором, официально...">
        </div>

        <div id="imageBlock" class="hidden" style="margin-top:14px;">
          <label class="label">Картинки (до 5)</label>
          <div class="drop-zone" id="dropZone">Перетащите или кликните для загрузки</div>
          <input type="file" id="fileInput" accept="image/*" multiple class="hidden">
          <div class="thumbs" id="thumbs"></div>
        </div>
      </div>

      <div class="panel">
        <div class="row" style="margin-bottom:14px;">
          <div class="num-field">
            <label>Кол-во комментов</label>
            <input type="number" id="countComments" min="1" max="50" value="10">
          </div>
          <div class="num-field">
            <label>Предложений</label>
            <input type="number" id="countSentences" min="1" max="10" value="3">
          </div>
        </div>

        <div class="checks">
          <label class="check"><input type="checkbox" id="optEmoji" checked> Со смайликами</label>
          <label class="check"><input type="checkbox" id="optPositive"> Строго позитивный тон</label>
        </div>
      </div>

      <div class="buttons">
        <button class="btn btn-primary" id="btnGenerate">✨ Сгенерировать новые</button>
        <button class="btn" id="btnClear">Очистить</button>
        <button class="btn hidden" id="btnDownload">⬇ Скачать в TXT</button>
      </div>

      <div class="status" id="status"></div>

      <div class="comments" id="comments"></div>

      <!-- ЛОГ РАБОТЫ (внизу) -->
      <div class="log-box">
        <h3>Лог работы</h3>
        <div class="log-list" id="logList"></div>
      </div>
    </section>

    <!-- ===== РАЗДЕЛ: ГЕНЕРАТОР ПАРОЛЕЙ ===== -->
    <section id="section-passwords" class="hidden">
      <h1>Генератор паролей</h1>

      <div class="panel">
        <div class="pwd-output">
          <input type="text" id="pwdOutput" readonly>
          <button class="btn btn-primary" id="btnCopyPwd">Копировать</button>
        </div>

        <div class="strength" id="pwdStrength">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="status" id="pwdStrengthLabel" style="margin-top:4px;">Надёжность</div>
      </div>

      <div class="panel">
        <label class="label">Длина пароля: <span class="slider-value" id="pwdLenVal">16</span></label>
        <input type="range" id="pwdLen" min="4" max="64" value="16">

        <div class="checks" style="margin-top:16px;">
          <label class="check"><input type="checkbox" id="pwdUpper" checked> Заглавные</label>
          <label class="check"><input type="checkbox" id="pwdLower" checked> Строчные</label>
          <label class="check"><input type="checkbox" id="pwdDigits" checked> Цифры</label>
          <label class="check"><input type="checkbox" id="pwdSymbols"> Символы</label>
          <label class="check"><input type="checkbox" id="pwdNoSimilar"> Без похожих</label>
          <label class="check"><input type="checkbox" id="pwdNoAmbiguous"> Без неоднозначных</label>
        </div>

        <div class="buttons">
          <button class="btn btn-primary" id="btnGenPwd">Сгенерировать</button>
        </div>
      </div>
    </section>

    <!-- ===== РАЗДЕЛ: ИНСТРУКЦИИ ===== -->
    <section id="section-instructions" class="hidden">
      <div id="instrListView">
        <h1>Инструкции</h1>
        <div class="instr-list" id="instrList"></div>
      </div>

      <div id="instrDetailView" class="hidden">
        <a href="#instructions" class="back-btn" id="instrBackBtn">← Назад к списку</a>
        <div class="instr-article" id="instrDetail"></div>
      </div>
    </section>

  </main>

  <!-- ==================== САЙДБАР ==================== -->

// Превращает URL/домены в HTML-теги <a> с target="_blank".
// Работает только с текстом вне существующих тегов.
function autoLinkHtml(html) {
  // Разбиваем на теги и текст, чтобы не трогать атрибуты тегов
  const parts = html.split(/(<[^>]+>)/g);

  const urlRegex = /\b((?:https?:\/\/|www\.)[^\s<)"']+|[a-z0-9-]+\.(?:com|ru|org|net|io|dev|ai|me|co|github\.io)(?:\/[^\s<)"']*)?)\b/gi;

  return parts.map(part => {
    // Если это тег — не трогаем
    if (part.startsWith('<')) return part;

    return part.replace(urlRegex, (match) => {
      // Убираем возможные хвостовые знаки препинания
      let clean = match;
      let tail = '';
      while (clean.length && /[.,;:!?)]$/.test(clean)) {
        tail = clean.slice(-1) + tail;
        clean = clean.slice(0, -1);
      }

      let href = clean;
      if (!/^https?:\/\//i.test(href)) {
        href = 'https://' + href;
      }
      return `<a href="${href}" target="_blank" rel="noopener">${clean}</a>${tail}`;
    });
  }).join('');
}

/* =========================================================================
   ОНЛАЙН-СЧЁТЧИК (BroadcastChannel)
   ========================================================================= */

const onlineCountEl = $('onlineCount');
let tabId = Math.random().toString(36).slice(2);
let knownTabs = new Set([tabId]);
let channel = null;

try {
  channel = new BroadcastChannel('online-counter');

  function announce() {
    channel.postMessage({ type: 'ping', id: tabId });
  }

  channel.onmessage = (e) => {
    const { type, id } = e.data || {};
    if (type === 'ping') {
      knownTabs.add(id);
      channel.postMessage({ type: 'pong', id: tabId });
      updateOnline();
    } else if (type === 'pong') {
      knownTabs.add(id);
      updateOnline();
    } else if (type === 'bye') {
      knownTabs.delete(id);
      updateOnline();
    }
  };

  window.addEventListener('beforeunload', () => {
    channel.postMessage({ type: 'bye', id: tabId });
  });

  announce();
  setInterval(announce, 5000);
} catch (e) {}

function updateOnline() {
  onlineCountEl.textContent = knownTabs.size;
}

  const time = new Date().toLocaleTimeString('ru-RU', { hour12: false });

  const timeSpan = document.createElement('span');
  timeSpan.className = 'log-time';
  timeSpan.textContent = `[${time}]`;

  const textSpan = document.createElement('span');
  textSpan.textContent = text;

  div.appendChild(timeSpan);
  div.appendChild(textSpan);

  logList.appendChild(div);
  logList.scrollTop = logList.scrollHeight;
}

function clearLog() {

const ANGLES = [

const dropZone = $('dropZone');
const fileInput = $('fileInput');
const thumbsEl = $('thumbs');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropZone.classList.add('drag');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

function handleFiles(files) {
  const arr = Array.from(files).slice(0, 5 - state.images.length);
  arr.forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      state.images.push(ev.target.result);
      renderThumbs();
    };
    reader.readAsDataURL(file);
  });
}

function renderThumbs() {
  thumbsEl.innerHTML = '';
  state.images.forEach((src, i) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.innerHTML = `<img src="${src}" alt=""><button data-i="${i}">×</button>`;
    div.querySelector('button').addEventListener('click', () => {
      state.images.splice(i, 1);
      renderThumbs();
    });
    thumbsEl.appendChild(div);
  });
}

function setStatus(text, type = '') {
  const el = $('status');
  el.textContent = text;
  el.className = 'status ' + type;
}

// Удаление ссылок из текста
function stripLinks(text) {
  return text.replace(/(https?:\/\/[^\s]+)/g, '').replace(/\s{2,}/g, ' ').trim();
}

function buildSystemPrompt(opts) {
  const { count, sentences, emoji, positive, style } = opts;

  let p = `Ты — генератор комментариев. Сгенерируй ${count} разных комментариев.\n`;
  p += `Каждый комментарий — ${sentences} предложений.\n`;

  if (positive) p += `Тон строго позитивный, без критики и негатива.\n`;
  if (emoji) p += `Добавляй уместные смайлики.\n`;
  if (style) p += `Стиль: ${style}.\n`;

  p += `ВАЖНО: не добавляй никакие ссылки, URL, адреса сайтов. Только текст.\n`;

  p += `Верни ответ строго в формате JSON-массива строк: ["коммент1", "коммент2", ...]. `;
  p += `Никакого лишнего текста, только JSON.`;

  return p;
}

async function respectRateLimit() {
  if (state.auth === 'key') return;
  const now = Date.now();
  const elapsed = now - state.lastRequestTime;
  const wait = 15000 - elapsed;
  if (wait > 0) {
    const sec = Math.ceil(wait / 1000);
    setStatus(`Ожидание лимита: ${sec} сек...`, 'loading');
    addLog(`Лимит анонимного режима: ждём ${sec} сек...`, 'info');
    await new Promise(r => setTimeout(r, wait));
  }
  state.lastRequestTime = Date.now();
}

async function generateComments() {
  if (state.generating) return;

  const postText = $('postText').value.trim();
  if (!postText && state.images.length === 0) {
    setStatus('Введите текст поста или загрузите картинку', 'error');
    addLog('Ошибка: не введён текст поста', 'err');
    return;
  }

  state.generating = true;
  $('btnGenerate').disabled = true;

  // Очищаем старые комментарии и лог перед новой генерацией
  state.comments = [];
  renderComments();
  $('btnDownload').classList.add('hidden');

  clearLog();
  addLog('Старт генерации...', 'info');
  setStatus('Генерация...', 'loading');

  try {
    await respectRateLimit();

    const cleanText = stripLinks(postText);

    const count = parseInt($('countComments').value) || 10;
    const sentences = parseInt($('countSentences').value) || 3;
    const emoji = $('optEmoji').checked;
    const positive = $('optPositive').checked;
    const style = $('styleText').value.trim();
    const angle = pick(ANGLES);

    addLog(`Параметры: ${count} комм., ${sentences} предл., ракурс «${angle}»`, 'info');

    const systemPrompt = buildSystemPrompt({ count, sentences, emoji, positive, style });

    let userContent = cleanText || 'Опиши изображение и оставь комментарий.';

    let url, headers, body;

    if (state.auth === 'key' && state.apiKey) {
      url = 'https://gen.pollinations.ai/v1/chat/completions';
      headers = {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + state.apiKey
      };

      const messages = [{ role: 'system', content: systemPrompt }];

      if (state.images.length) {
        const contentParts = [{ type: 'text', text: userContent }];
        state.images.forEach(src => {
          contentParts.push({ type: 'image_url', image_url: { url: src } });
        });
        messages.push({ role: 'user', content: contentParts });
      } else {
        messages.push({ role: 'user', content: userContent });
      }

      body = JSON.stringify({
        model: 'openai',
        messages,
        temperature: rand(0.9, 1.15),
        seed: randInt(1, 999999)
      });
    } else {
      url = 'https://text.pollinations.ai/openai';
      headers = { 'Content-Type': 'application/json' };
      body = JSON.stringify({
        model: 'openai',
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userContent }
        ],
        temperature: rand(0.9, 1.15),
        seed: randInt(1, 999999)
      });
    }

    addLog('Отправка запроса к Pollinations...', 'info');

    const resp = await fetch(url, { method: 'POST', headers, body });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);

    addLog('Ответ получен, разбираю...', 'info');

    const data = await resp.json();

    let raw = '';
    if (data.choices && data.choices[0] && data.choices[0].message) {
      raw = data.choices[0].message.content;
    } else if (typeof data === 'string') {
      raw = data;
    } else if (data.text) {
      raw = data.text;
    } else {
      throw new Error('Неизвестный формат ответа');
    }

    let list = parseComments(raw, count);
    list = list.map(c => stripLinks(c)).filter(Boolean);

    state.comments = list;
    renderComments();

    setStatus(`Готово: ${list.length} комментариев`, 'success');
    addLog(`✓ Готово: ${list.length} комментариев`, 'ok');

    $('btnDownload').classList.toggle('hidden', list.length < 10);

  } catch (err) {
    console.error(err);
    setStatus('Ошибка: ' + err.message, 'error');
    addLog(`✗ Ошибка: ${err.message}`, 'err');
  } finally {
    state.generating = false;
    $('btnGenerate').disabled = false;
  }
}

function parseComments(raw, count) {
  let text = raw.trim();
  text = text.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '');

  const start = text.indexOf('[');
  const end = text.lastIndexOf(']');
  if (start !== -1 && end !== -1 && end > start) {
    try {
      const arr = JSON.parse(text.slice(start, end + 1));
      if (Array.isArray(arr)) {
        return arr.map(s => String(s).trim()).filter(Boolean);
      }
    } catch (e) {}
  }

  return text
    .split('\n')
    .map(s => s.replace(/^\s*[\d]+[\.\)]\s*/, '').trim())
    .filter(s => s.length > 3)
    .slice(0, count);
}

function renderComments() {
  const container = $('comments');
  container.innerHTML = '';

  state.comments.forEach((text, i) => {
    const div = document.createElement('div');
    div.className = 'comment';
    div.innerHTML = `
      <div class="comment-head">
        <span class="comment-num">#${i + 1}</span>
      </div>
      <div class="comment-text">${escapeHtml(text)}</div>
      <div class="comment-actions">
        <button data-action="regen" data-i="${i}">Ещё вариант</button>
        <button data-action="copy" data-i="${i}">Копировать</button>
      </div>
    `;
    container.appendChild(div);
  });

  container.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.i);
      if (btn.dataset.action === 'copy') {
        navigator.clipboard.writeText(state.comments[i]).then(() => {
          btn.textContent = '✓ Скопировано';
          setTimeout(() => btn.textContent = 'Копировать', 1500);
        });
      } else if (btn.dataset.action === 'regen') {
        regenOne(i);
      }
    });
  });
}

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

async function regenOne(index) {
  addLog(`Регенерация комментария ${index + 1}...`, 'info');
  setStatus('Генерация варианта...', 'loading');

  try {
    await respectRateLimit();

    const postText = $('postText').value.trim();
    const cleanText = stripLinks(postText);
    const angle = pick(ANGLES);

    const systemPrompt = buildSystemPrompt({
      count: 1,
      sentences: parseInt($('countSentences').value) || 3,
      emoji: $('optEmoji').checked,
      positive: $('optPositive').checked,
      style: $('styleText').value.trim()
    });

    const url = state.auth === 'key' && state.apiKey
      ? 'https://gen.pollinations.ai/v1/chat/completions'
      : 'https://text.pollinations.ai/openai';

    const headers = { 'Content-Type': 'application/json' };
    if (state.auth === 'key' && state.apiKey) {
      headers['Authorization'] = 'Bearer ' + state.apiKey;
    }

    const resp = await fetch(url, {
      method: 'POST',
      headers,
      body: JSON.stringify({
        model: 'openai',
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: cleanText || 'Оставь комментарий.' }
        ],
        temperature: rand(0.9, 1.15),
        seed: randInt(1, 999999)
      })
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    let raw = data.choices?.[0]?.message?.content || data.text || '';
    const list = parseComments(raw, 1);
    if (list.length) {
      state.comments[index] = stripLinks(list[0]);
      renderComments();
      setStatus('Вариант обновлён', 'success');
      addLog(`✓ Комментарий ${index + 1} обновлён`, 'ok');
    }
  } catch (err) {
    setStatus('Ошибка: ' + err.message, 'error');
    addLog(`✗ Регенерация ${index + 1}: ${err.message}`, 'err');
  }
}

// Скачивание TXT (без нумерации, один коммент = одна строка)
$('btnDownload').addEventListener('click', () => {
  const text = state.comments.join('\n');
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'comments.txt';
  a.click();
  URL.revokeObjectURL(a.href);
});

/* =========================================================================
   ГЕНЕРАТОР ПАРОЛЕЙ
   ========================================================================= */

const pwdOutput = $('pwdOutput');

const CHARS = {
  upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  lower: 'abcdefghijklmnopqrstuvwxyz',
  digits: '0123456789',
  symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
};

const SIMILAR = 'il1Lo0O';
const AMBIGUOUS = '{}[]()/\\\'"`~,;:.<>';

function generatePassword() {
  const len = parseInt($('pwdLen').value);
  let pool = '';

  if ($('pwdUpper').checked) pool += CHARS.upper;
  if ($('pwdLower').checked) pool += CHARS.lower;
  if ($('pwdDigits').checked) pool += CHARS.digits;
  if ($('pwdSymbols').checked) pool += CHARS.symbols;

  if (!pool) pool = CHARS.lower;

  if ($('pwdNoSimilar').checked) {
    pool = [...pool].filter(c => !SIMILAR.includes(c)).join('');
  }
  if ($('pwdNoAmbiguous').checked) {
    pool = [...pool].filter(c => !AMBIGUOUS.includes(c)).join('');
  }

  if (!pool) pool = CHARS.lower;

  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  let pwd = '';
  for (let i = 0; i < len; i++) {
    pwd += pool[arr[i] % pool.length];
  }

  pwdOutput.value = pwd;
  updateStrength(pwd);
}

function updateStrength(pwd) {
  const bars = $('pwdStrength').querySelectorAll('span');
  const label = $('pwdStrengthLabel');

  let score = 0;
  if (pwd.length >= 8) score++;
  if (pwd.length >= 12) score++;
  if (pwd.length >= 16) score++;
  if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
  if (/\d/.test(pwd)) score++;
  if (/[^A-Za-z0-9]/.test(pwd)) score++;

  const level = Math.min(4, Math.floor(score / 1.5));

  const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e'];
  const labels = ['Очень слабый', 'Слабый', 'Средний', 'Надёжный'];

  bars.forEach((bar, i) => {
    bar.style.background = i < level ? colors[level - 1] : 'var(--border)';
  });
  label.textContent = level > 0 ? labels[level - 1] : 'Очень слабый';
}

$('pwdLen').addEventListener('input', (e) => {
  $('pwdLenVal').textContent = e.target.value;
  generatePassword();
  storage.set('pwdLen', e.target.value);
});

['pwdUpper', 'pwdLower', 'pwdDigits', 'pwdSymbols', 'pwdNoSimilar', 'pwdNoAmbiguous']
  .forEach(id => {
    $(id).addEventListener('change', () => {
      generatePassword();
      storage.set(id, $(id).checked);
    });
  });

$('btnGenPwd').addEventListener('click', generatePassword);

$('btnCopyPwd').addEventListener('click', () => {
  if (!pwdOutput.value) return;
  navigator.clipboard.writeText(pwdOutput.value).then(() => {
    const btn = $('btnCopyPwd');
    const orig = btn.textContent;
    btn.textContent = '✓ Скопировано';
    setTimeout(() => btn.textContent = orig, 1500);
  });
});

function restorePwdSettings() {
  const len = storage.get('pwdLen', 16);
  $('pwdLen').value = len;
  $('pwdLenVal').textContent = len;

  ['pwdUpper', 'pwdLower', 'pwdDigits', 'pwdSymbols', 'pwdNoSimilar', 'pwdNoAmbiguous']
    .forEach(id => {
      const def = id === 'pwdUpper' || id === 'pwdLower' || id === 'pwdDigits';
      $(id).checked = storage.get(id, def);
    });

  generatePassword();
}
